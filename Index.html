<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raja AI</title>

<style>
body {
  margin: 0;
  background: #212121;
  color: white;
  font-family: Arial, sans-serif;
}
header {
  padding: 18px;
  text-align: center;
  background: #171717;
  font-size: 24px;
}
#chat {
  height: 70vh;
  overflow-y: auto;
  padding: 15px;
}
.msg {
  padding: 12px;
  margin: 10px 0;
  border-radius: 12px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.user { background: #285943; }
.bot { background: #383838; }
footer {
  position: fixed;
  bottom: 0;
  background: #171717;
  padding: 10px;
  display: flex;
  gap: 6px;
  width: calc(100% - 20px);
}
input {
  min-width: 0;
  flex: 1;
  padding: 12px;
  border-radius: 10px;
  border: 0;
  font-size: 16px;
}
button {
  padding: 10px;
  border: 0;
  border-radius: 10px;
  background: #19c37d;
  font-size: 17px;
}
</style>
</head>

<body>
<header>🤖 Raja AI</header>

<div id="chat">
  <div class="msg bot">
नमस्ते! मैं Raja AI हूँ। अपना सवाल लिखो या 🎤 बटन से बोलो।
  </div>
</div>

<footer>
  <input id="question" placeholder="अपना सवाल लिखो...">
  <button onclick="speakQuestion()">🎤</button>
  <button onclick="sendQuestion()">➤</button>
</footer>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("question");

function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "msg " + type;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function sendQuestion() {
  const question = input.value.trim();
  if (!question) return;

  addMessage(question, "user");
  input.value = "";

  const waiting = document.createElement("div");
  waiting.className = "msg bot";
  waiting.textContent = "जवाब ढूँढ रहा हूँ...";
  chat.appendChild(waiting);
  chat.scrollTop = chat.scrollHeight;

  try {
    // असली AI Backend का URL यहाँ जोड़ना होगा।
    const API_URL = "";

    if (!API_URL) {
      waiting.textContent =
        "अभी AI कनेक्ट नहीं है। इसे सभी सवालों के जवाब देने के लिए सुरक्षित AI Backend से जोड़ना होगा।";
      return;
    }

    const response = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question })
    });

    if (!response.ok) throw new Error("Request failed");

    const data = await response.json();
    waiting.textContent = data.answer || "जवाब नहीं मिला।";

  } catch (error) {
    waiting.textContent =
      "कनेक्शन में समस्या है। बाद में फिर कोशिश करो।";
  }
}

function speakQuestion() {
  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    alert("वॉइस सुविधा के लिए Chrome में कोशिश करो।");
    return;
  }

  const recognition = new SpeechRecognition();
  recognition.lang = "hi-IN";
  recognition.onresult = event => {
    input.value = event.results[0][0].transcript;
    sendQuestion();
  };
  recognition.start();
}

input.addEventListener("keydown", event => {
  if (event.key === "Enter") sendQuestion();
});
</script>
</body>
</html>
