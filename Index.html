<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raja AI</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #212121;
  color: white;
}

header {
  padding: 18px;
  background: #171717;
  text-align: center;
  font-size: 24px;
  font-weight: bold;
}

#chat {
  padding: 15px;
  padding-bottom: 90px;
  height: 78vh;
  overflow-y: auto;
}

.message {
  padding: 13px;
  margin: 12px 0;
  border-radius: 12px;
  line-height: 1.6;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.user {
  background: #285943;
  margin-left: 15%;
}

.bot {
  background: #383838;
  margin-right: 10%;
}

footer {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  display: flex;
  gap: 7px;
  padding: 10px;
  background: #171717;
}

input {
  flex: 1;
  min-width: 0;
  padding: 13px;
  border: 0;
  border-radius: 10px;
  font-size: 16px;
}

button {
  border: 0;
  border-radius: 10px;
  padding: 10px;
  background: #19c37d;
  font-size: 17px;
}

</style>
</head>

<body>

<header>🤖 Raja AI</header>

<div id="chat">
  <div class="message bot">
नमस्ते! 👋 मैं Raja AI हूँ।
अपना सवाल लिखो या माइक्रोफोन से बोलो।
  </div>
</div>

<footer>
  <input id="question" placeholder="यहाँ सवाल लिखो...">
  <button onclick="startVoice()">🎤</button>
  <button onclick="askAI()">➤</button>
</footer>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("question");

function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "message " + type;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

async function askAI() {
  const question = input.value.trim();
  if (!question) return;

  addMessage(question, "user");
  input.value = "";

  const reply = addMessage("AI से कनेक्शन जोड़ना बाकी है।", "bot");

  // असली AI Backend का पता यहाँ जोड़ा जाएगा।
  // API key को इस फाइल में कभी मत डालना।
}

input.addEventListener("keydown", event => {
  if (event.key === "Enter") askAI();
});

function startVoice() {
  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    alert("Chrome में माइक्रोफोन सुविधा आज़माओ।");
    return;
  }

  const recognition = new SpeechRecognition();
  recognition.lang = "hi-IN";

  recognition.onresult = event => {
    input.value = event.results[0][0].transcript;
    askAI();
  };

  recognition.start();
}
</script>

</body>
</html>
